# One command for the whole P4 demo:  docker compose up --build
services:
  siddhi:
    image: siddhiio/siddhi-runner-alpine
    command: -Dapps=/apps/P4Events.siddhi
    ports: ["8006:8006"]
    extra_hosts: ["host.docker.internal:host-gateway"] # Siddhi reaches the PAIS via the host
    volumes: ["./siddhi/P4Events.siddhi:/apps/P4Events.siddhi:ro"]

  pais:
    build: ./pais/dcr
    ports: ["8090:8090"]
    environment:
      SIDDHI_URL: http://siddhi:8006/dcr-events
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 3s
      retries: 40

  case-setup: # creates the case and requests the assessment
    image: curlimages/curl
    user: root
    entrypoint: ["sh", "/demo/case.sh", "setup"]
    volumes: ["./demo:/demo:ro"]
    depends_on:
      pais: { condition: service_healthy }
      siddhi: { condition: service_started }

  poller: # event source: new publications from OpenAlex
    build: ./src/openalex
    command: ["A5069386704", "2025-01-01"]
    environment:
      SIDDHI_URL: http://siddhi:8006/publications
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    depends_on:
      case-setup: { condition: service_completed_successfully }

  case-finish: # finishes the case once the research output has arrived
    image: curlimages/curl
    user: root
    entrypoint: ["sh", "/demo/case.sh", "finish"]
    volumes: ["./demo:/demo:ro", "./output:/output"]
    depends_on:
      case-setup: { condition: service_completed_successfully }
